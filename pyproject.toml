[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texmap"
version = "0.1.0"
description = "Reference-map based single-cell integration, interpretation, and web reporting."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "TexMap contributors"}
]
keywords = ["single-cell", "integration", "scRNA-seq", "scATAC-seq", "UMAP", "pathway-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = []

[project.optional-dependencies]
analysis = [
  "numpy>=1.23",
  "pandas>=1.5",
  "pyyaml>=6.0",
  "anndata>=0.9",
  "scanpy>=1.9",
  "scikit-learn>=1.2",
  "scipy>=1.10"
]
web = [
  "plotly>=5.18"
]
agent = []
docs = [
  "mkdocs-material>=9.5"
]
dev = [
  "pytest>=7.0"
]

[project.scripts]
texmap = "texmap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
texmap = ["webapp/*.html", "webapp/*.css", "webapp/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
